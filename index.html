<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="SportApp">
        <title>Sport App</title>
        <link rel="stylesheet" href="style.css">
        <link rel="apple-touch-icon" href="icon.png">
        <link rel="icon" type="image/png" href="icon.png">
    </head>
    <body>
        <!-- BUNDESLIGA ANSICHT-->
        <main class="swipe-container">
            <section id="view-b1" class="view">
                <div class="segment-control">
                    <button class="segment-btn active" onclick="switchBundesligaSubView('b1-matches', this)">Spieltage</button>
                    <button class="segment-btn" onclick="switchBundesligaSubView('b1-table', this)">Tabelle</button>
                </div>

                <!-- SPIELTAGE ANSICHT-->
                <div id="b1-matches" class="sub-view active">
                    <!-- Spieltag Auswahl -->
                    <div class="matchday-picker">
                        <button class="nav-btn" id="b1-prev-day" onclick="changeMatchday(-1)">&lsaquo;</button>
                        <select id="b1-day-select" class="day-select" onchange="onMatchdaySelect(this.value)">
                            <!-- Wird per JS mit 1. bis 34. Spieltag befüllt -->
                        </select>
                        <button class="nav-btn" id="b1-next-day" onclick="changeMatchday(1)">&rsaquo;</button>
                    </div>
                    <!-- Ein Spiel -->
                    <div id="b1-matches-list">
                        <div class="loading-state">Lade aktuellen Spieltag...</div>
                    </div>
                </div>

                <!-- TABELLEN ANSICHT -->
                <div id="b1-table" class="sub-view">
                    <div class="table-card">
                        <table class="ios-table">
                            <thead>
                                <tr>
                                    <th class="col-pos">#</th>
                                    <th class="col-club">Klub</th>
                                    <th class="col-num">Sp</th>
                                    <th class="col-num">Diff</th>
                                    <th class="col-num">Pkt</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="col-pos">1</td>
                                    <td class="col-club">FC Bayern</td>
                                    <td class="col-num">0</td>
                                    <td class="col-num">0</td>
                                    <td class="col-num bold">0</td>
                                </tr>
                                <tr>
                                    <td class="col-pos">2</td>
                                    <td class="col-club">Bayer Leverkusen</td>
                                    <td class="col-num">0</td>
                                    <td class="col-num">0</td>
                                    <td class="col-num bold">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <section id="view-b2" class="view"></section>
            <section id="view-b3" class="view"></section>
            <section id="view-f1" class="view"></section>
        </main>
        <!-- Ansichten 
        <div id="view-b1" class="view active"></div>
        <div id="view-b2" class="view"></div>
        <div id="view-b3" class="view"></div>
        <div id="view-f1" class="view"></div>
        -->
        <!-- Navigations Buttons unten
         <nav class="tab-bar">
            <button class="tab-button active" onclick="switchTab('view-b1', this)">Bundesliga</button>
            <button class="tab-button" onclick="switchTab('view-b2', this)">2. Bundesliga</button>
            <button class="tab-button" onclick="switchTab('view-b3', this)">3. Bundesliga</button>
            <button class="tab-button" onclick="switchTab('view-f1', this)">Formel 1</button>
         </nav>
        -->
         <script src="script.js"></script>
    </body>
</html>
